<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FEASTFALL architecture</title>
  <desc id="d">Browser clients talk to an authoritative Node game server over a WebSocket. The server writes a JSONL ledger that a Bruin pipeline on DuckDB turns into reputation.json, which is hot-loaded back into the agents. Runware generates art cached to data/images; Blender produces GLB models.</desc>
  <defs>
    <marker id="ember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a3d"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4c95d"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa6bd"/></marker>
    <linearGradient id="hdr" x1="0" x2="1"><stop offset="0" stop-color="#ff7a3d"/><stop offset="1" stop-color="#f4c95d"/></linearGradient>
  </defs>

  <rect width="1400" height="800" rx="18" fill="#0f1626"/>

  <!-- title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="url(#hdr)" letter-spacing="2">FEASTFALL</text>
  <text x="208" y="50" font-size="18" fill="#9aa6bd">architecture · runtime loop (ember) and learning loop (gold)</text>

  <!-- ================= Browser clients ================= -->
  <rect x="40" y="90" width="280" height="330" rx="14" fill="#16213a" stroke="#ff7a3d" stroke-width="1.5"/>
  <text x="60" y="122" font-size="17" font-weight="700" fill="#ff7a3d">Browser clients</text>
  <text x="60" y="142" font-size="12" fill="#9aa6bd">phones (QR join) · laptop · TV (?tv)</text>
  <g font-size="13" fill="#e8ecf4">
    <rect x="56" y="158" width="248" height="38" rx="8" fill="#1d2a47"/><text x="70" y="182">Three.js 3D island + HUD</text>
    <rect x="56" y="204" width="248" height="38" rx="8" fill="#1d2a47"/><text x="70" y="228">Web Speech voices + voice input</text>
    <rect x="56" y="250" width="248" height="38" rx="8" fill="#1d2a47"/><text x="70" y="274">WebCrypto SHA-256 verify</text>
    <rect x="56" y="296" width="248" height="38" rx="8" fill="#1d2a47"/><text x="70" y="320">QR join (/api/qr)</text>
    <rect x="56" y="342" width="248" height="62" rx="8" fill="#1d2a47"/><text x="70" y="366">Ledger panel · trust cards</text><text x="70" y="388">council ballot · end screen</text>
  </g>

  <!-- ================= WebSocket ================= -->
  <text x="400" y="176" font-size="14" font-weight="700" fill="#f4c95d" text-anchor="middle">WebSocket /ws</text>
  <line x1="324" y1="206" x2="474" y2="206" stroke="#ff7a3d" stroke-width="2.5" marker-end="url(#ember)"/>
  <text x="400" y="226" font-size="11" fill="#e8ecf4" text-anchor="middle">join · dir · move · act</text>
  <text x="400" y="240" font-size="11" fill="#e8ecf4" text-anchor="middle">chat · vote · director</text>
  <line x1="476" y1="270" x2="326" y2="270" stroke="#ff7a3d" stroke-width="2.5" marker-end="url(#ember)"/>
  <text x="400" y="290" font-size="11" fill="#e8ecf4" text-anchor="middle">state @10 Hz · ledger · say</text>
  <text x="400" y="304" font-size="11" fill="#e8ecf4" text-anchor="middle">event · council · reveal · trust</text>

  <!-- ================= Node server ================= -->
  <rect x="480" y="90" width="480" height="450" rx="14" fill="#16213a" stroke="#ff7a3d" stroke-width="1.5"/>
  <text x="500" y="122" font-size="17" font-weight="700" fill="#ff7a3d">Node server</text>
  <text x="608" y="122" font-size="12" fill="#9aa6bd">Express + ws · authoritative sim · :8787</text>

  <rect x="496" y="138" width="448" height="128" rx="10" fill="#1b2742" stroke="#2a3a5c"/>
  <text x="512" y="160" font-size="13" font-weight="700" fill="#f4c95d">Game sim · 10 Hz tick · per agent</text>
  <g font-size="12" fill="#e8ecf4" text-anchor="middle">
    <rect x="508" y="176" width="92" height="74" rx="8" fill="#243457"/><text x="554" y="206" font-weight="700">Perception</text><text x="554" y="224" fill="#9aa6bd" font-size="11">VIEW = 11</text><text x="554" y="239" fill="#9aa6bd" font-size="11">witnessing</text>
    <rect x="618" y="176" width="92" height="74" rx="8" fill="#243457"/><text x="664" y="206" font-weight="700">Trust</text><text x="664" y="224" fill="#9aa6bd" font-size="11">matrix 0.01–0.99</text><text x="664" y="239" fill="#9aa6bd" font-size="11">+ gossip</text>
    <rect x="728" y="176" width="92" height="74" rx="8" fill="#243457"/><text x="774" y="206" font-weight="700">Utility</text><text x="774" y="224" fill="#9aa6bd" font-size="11">14 actions</text><text x="774" y="239" fill="#9aa6bd" font-size="11">× policy weight</text>
    <rect x="838" y="176" width="92" height="74" rx="8" fill="#243457"/><text x="884" y="206" font-weight="700">Action</text><text x="884" y="224" fill="#9aa6bd" font-size="11">move · work</text><text x="884" y="239" fill="#9aa6bd" font-size="11">speak · log</text>
  </g>
  <line x1="600" y1="213" x2="616" y2="213" stroke="#ff7a3d" stroke-width="2" marker-end="url(#ember)"/>
  <line x1="710" y1="213" x2="726" y2="213" stroke="#ff7a3d" stroke-width="2" marker-end="url(#ember)"/>
  <line x1="820" y1="213" x2="836" y2="213" stroke="#ff7a3d" stroke-width="2" marker-end="url(#ember)"/>

  <rect x="496" y="282" width="216" height="112" rx="10" fill="#1b2742" stroke="#2a3a5c"/>
  <text x="512" y="306" font-size="13" font-weight="700" fill="#f4c95d">Council</text>
  <g font-size="12" fill="#e8ecf4"><text x="512" y="328">Marigold calls it when the</text><text x="512" y="346">village trust floor drops</text><text x="512" y="364">22 s vote · ≥2 votes to exile</text><text x="512" y="382" fill="#9aa6bd">wildfire = traitor distraction</text></g>

  <rect x="728" y="282" width="216" height="112" rx="10" fill="#1b2742" stroke="#2a3a5c"/>
  <text x="744" y="306" font-size="13" font-weight="700" fill="#f4c95d">Sealed ledger</text>
  <g font-size="12" fill="#e8ecf4"><text x="744" y="328">secret moves committed as</text><text x="744" y="346">SHA-256(entry + salt)</text><text x="744" y="364">revealed at exile / sunset</text><text x="744" y="382" fill="#9aa6bd">steal · stash · ignite · deceive</text></g>

  <rect x="496" y="410" width="448" height="56" rx="10" fill="#1b2742" stroke="#f4c95d" stroke-dasharray="4 4"/>
  <text x="512" y="434" font-size="13" font-weight="700" fill="#f4c95d">Policy update at match end</text>
  <text x="512" y="454" font-size="12" fill="#e8ecf4">reward-weighted action weights → data/memory/policy.json</text>

  <text x="500" y="492" font-size="12" fill="#9aa6bd">HTTP: /api/health · /api/memory · /api/policy · /api/ledger</text>
  <text x="500" y="512" font-size="12" fill="#9aa6bd">/api/bruin · POST /api/bruin/run · /api/images · /api/qr</text>

  <!-- ================= Data files ================= -->
  <rect x="1060" y="90" width="300" height="92" rx="14" fill="#16213a" stroke="#ff7a3d" stroke-width="1.5"/>
  <text x="1080" y="120" font-size="15" font-weight="700" fill="#ff7a3d">Match data on disk</text>
  <text x="1080" y="144" font-size="12" fill="#e8ecf4" font-family="JetBrains Mono, Menlo, monospace">data/ledger/*.jsonl</text>
  <text x="1080" y="164" font-size="12" fill="#e8ecf4" font-family="JetBrains Mono, Menlo, monospace">data/matches/*.json</text>
  <line x1="962" y1="136" x2="1056" y2="136" stroke="#ff7a3d" stroke-width="2.5" marker-end="url(#ember)"/>
  <text x="1009" y="126" font-size="11" fill="#e8ecf4" text-anchor="middle">append every</text>
  <text x="1009" y="154" font-size="11" fill="#e8ecf4" text-anchor="middle">event</text>

  <!-- ================= Bruin ================= -->
  <rect x="1060" y="232" width="300" height="236" rx="14" fill="#16213a" stroke="#f4c95d" stroke-width="2"/>
  <text x="1080" y="262" font-size="17" font-weight="700" fill="#f4c95d">Bruin pipeline</text>
  <text x="1080" y="282" font-size="12" fill="#9aa6bd">DuckDB · 6 assets · 27 quality checks</text>
  <g font-size="12" fill="#e8ecf4" font-family="JetBrains Mono, Menlo, monospace">
    <rect x="1076" y="296" width="128" height="28" rx="6" fill="#243457"/><text x="1088" y="315">raw.ledger</text>
    <rect x="1216" y="296" width="128" height="28" rx="6" fill="#243457"/><text x="1228" y="315">raw.matches</text>
    <rect x="1076" y="338" width="268" height="28" rx="6" fill="#2b3350"/><text x="1088" y="357">mart.reputation</text>
    <rect x="1076" y="372" width="268" height="28" rx="6" fill="#2b3350"/><text x="1088" y="391">mart.agent_policy</text>
    <rect x="1076" y="406" width="268" height="28" rx="6" fill="#2b3350"/><text x="1088" y="425">mart.match_summary</text>
  </g>
  <text x="1080" y="456" font-size="12" fill="#f4c95d" font-family="JetBrains Mono, Menlo, monospace">→ memory.export_reputation_json</text>
  <line x1="1210" y1="184" x2="1210" y2="228" stroke="#f4c95d" stroke-width="2.5" marker-end="url(#gold)"/>
  <text x="1222" y="204" font-size="11" fill="#e8ecf4">npm run bruin</text>
  <text x="1222" y="219" font-size="11" fill="#9aa6bd">auto after every match</text>

  <!-- ================= reputation.json ================= -->
  <rect x="1060" y="520" width="300" height="74" rx="14" fill="#16213a" stroke="#f4c95d" stroke-width="2"/>
  <text x="1080" y="550" font-size="13" font-weight="700" fill="#f4c95d" font-family="JetBrains Mono, Menlo, monospace">data/memory/reputation.json</text>
  <text x="1080" y="574" font-size="12" fill="#e8ecf4">actors{} · policy{} · matches[last 10]</text>
  <line x1="1210" y1="470" x2="1210" y2="516" stroke="#f4c95d" stroke-width="2.5" marker-end="url(#gold)"/>
  <text x="1222" y="498" font-size="11" fill="#e8ecf4">COPY to JSON</text>

  <!-- back into agents -->
  <path d="M1058 557 L1000 557 L1000 440 L964 440" fill="none" stroke="#f4c95d" stroke-width="2.5" marker-end="url(#gold)"/>
  <text x="1060" y="620" font-size="11" fill="#f4c95d">↖ hot-loaded into agents at join / match start:</text>
  <text x="1060" y="636" font-size="11" fill="#e8ecf4">trust priors (reputation) + policy priors (win_rate)</text>

  <!-- ================= Runware ================= -->
  <rect x="480" y="618" width="290" height="112" rx="14" fill="#16213a" stroke="#ff7a3d" stroke-width="1.5"/>
  <text x="500" y="648" font-size="17" font-weight="700" fill="#ff7a3d">Runware API</text>
  <text x="500" y="670" font-size="12" fill="#e8ecf4" font-family="JetBrains Mono, Menlo, monospace">imageInference · runware:100@1</text>
  <text x="500" y="690" font-size="12" fill="#e8ecf4">5 portraits · 8 event cinematics · hero</text>
  <text x="500" y="710" font-size="12" fill="#9aa6bd">14 images in parallel, ~2.5 s</text>
  <line x1="625" y1="542" x2="625" y2="614" stroke="#ff7a3d" stroke-width="2.5" marker-end="url(#ember)"/>
  <text x="637" y="574" font-size="11" fill="#e8ecf4">warm() on boot,</text>
  <text x="637" y="589" font-size="11" fill="#9aa6bd">lazy for missing art</text>

  <rect x="820" y="618" width="200" height="112" rx="14" fill="#16213a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="840" y="648" font-size="15" font-weight="700" fill="#e8ecf4">Image cache</text>
  <text x="840" y="672" font-size="12" fill="#e8ecf4" font-family="JetBrains Mono, Menlo, monospace">data/images/*.webp</text>
  <text x="840" y="694" font-size="12" fill="#9aa6bd">works offline once</text>
  <text x="840" y="710" font-size="12" fill="#9aa6bd">generated</text>
  <line x1="772" y1="674" x2="816" y2="674" stroke="#ff7a3d" stroke-width="2.5" marker-end="url(#ember)"/>

  <!-- images to clients -->
  <path d="M920 732 L920 768 L296 768 L296 424" fill="none" stroke="#ff7a3d" stroke-width="2.5" marker-end="url(#ember)"/>
  <text x="560" y="760" font-size="11" fill="#e8ecf4">served at /images/*.webp → portraits, cinematics, join screen</text>

  <!-- ================= Blender ================= -->
  <rect x="40" y="618" width="220" height="112" rx="14" fill="#16213a" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="60" y="648" font-size="17" font-weight="700" fill="#e8ecf4">Blender</text>
  <text x="60" y="670" font-size="12" fill="#e8ecf4" font-family="JetBrains Mono, Menlo, monospace">public/models/*.glb</text>
  <text x="60" y="690" font-size="12" fill="#9aa6bd">island · granary · campfire</text>
  <text x="60" y="708" font-size="12" fill="#9aa6bd">pier · bushes · trees · props</text>
  <line x1="150" y1="614" x2="150" y2="424" stroke="#9aa6bd" stroke-width="2.5" marker-end="url(#grey)"/>
  <text x="162" y="520" font-size="11" fill="#e8ecf4">GLTFLoader</text>
  <text x="162" y="535" font-size="11" fill="#9aa6bd">(procedural fallback)</text>

  <!-- legend -->
  <g font-size="12" fill="#9aa6bd">
    <line x1="1080" y1="680" x2="1120" y2="680" stroke="#ff7a3d" stroke-width="2.5"/><text x="1130" y="684">runtime data flow</text>
    <line x1="1080" y1="704" x2="1120" y2="704" stroke="#f4c95d" stroke-width="2.5"/><text x="1130" y="708">learning loop (between matches)</text>
    <line x1="1080" y1="728" x2="1120" y2="728" stroke="#9aa6bd" stroke-width="2.5"/><text x="1130" y="732">static assets</text>
  </g>
</svg>
